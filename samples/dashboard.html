<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>demo dashboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #111; background: #eef1f6; }
    body { margin: 1.5rem; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 24rem; }
    .card { background: #fff; border-radius: 10px; padding: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    .val { font-size: 1.5rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Dashboard</h1>
  <div class="grid">
    <div class="card"><div>Items</div><div class="val">3</div></div>
    <div class="card"><div>Branches</div><div class="val">6+</div></div>
  </div>
</body>
</html>
